<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#702963"/>
      <stop offset="100%" stop-color="#17102b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="300" rx="25" fill="#0d1117"/>

  <!-- Antenna -->
  <path d="M150 55 V35" stroke="#ff69b4" stroke-width="5"/>
  <circle cx="150" cy="28" r="9" fill="#ff69b4" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Ears -->
  <rect x="48" y="105" width="25" height="65" rx="9" fill="#702963" stroke="#ff69b4" stroke-width="3"/>
  <rect x="227" y="105" width="25" height="65" rx="9" fill="#702963" stroke="#ff69b4" stroke-width="3"/>

  <!-- Robot head -->
  <rect x="65" y="55" width="170" height="145" rx="28" fill="url(#body)" stroke="#ff69b4" stroke-width="4"/>

  <!-- Face screen -->
  <rect x="82" y="78" width="136" height="92" rx="18" fill="#090014" stroke="#c084fc" stroke-width="2"/>

  <!-- Left eye -->
  <g>
    <ellipse cx="120" cy="115" rx="14" ry="18" fill="#ff69b4" filter="url(#glow)">
      <animate attributeName="ry" values="18;18;2;18;18" keyTimes="0;0.43;0.48;0.53;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="124" cy="111" r="4" fill="#ffffff">
      <animate attributeName="cx" values="124;128;124;116;124" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right eye -->
  <g>
    <ellipse cx="180" cy="115" rx="14" ry="18" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="ry" values="18;18;2;18;18" keyTimes="0;0.43;0.48;0.53;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="184" cy="111" r="4" fill="#ffffff">
      <animate attributeName="cx" values="184;188;184;176;184" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mouth -->
  <path d="M126 145 Q150 160 174 145" fill="none" stroke="#ff69b4" stroke-width="4" stroke-linecap="round">
    <animate attributeName="d" values="M126 145 Q150 160 174 145;M126 145 Q150 151 174 145;M126 145 Q150 160 174 145" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Body -->
  <path d="M100 200 L88 235 Q150 260 212 235 L200 200" fill="url(#body)" stroke="#ff69b4" stroke-width="3"/>

  <rect x="125" y="208" width="50" height="24" rx="8" fill="#090014" stroke="#c084fc" stroke-width="2"/>

  <circle cx="137" cy="220" r="4" fill="#ff69b4">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="220" r="4" fill="#c084fc">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="163" cy="220" r="4" fill="#ff69b4">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <circle cx="35" cy="65" r="3" fill="#ff69b4">
    <animate attributeName="cy" values="65;50;65" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="215" r="4" fill="#c084fc">
    <animate attributeName="cy" values="215;195;215" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
