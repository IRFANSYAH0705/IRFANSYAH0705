<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#292044"/>
      <stop offset="100%" stop-color="#10091f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="300" rx="22" fill="#090014"/>
  <circle cx="160" cy="140" r="105" fill="#702963" opacity=".18"/>

  <!-- Antena -->
  <path d="M160 55 V35" stroke="#ff69b4" stroke-width="5" stroke-linecap="round"/>
  <circle cx="160" cy="27" r="9" fill="#ff69b4" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Telinga kucing -->
  <path d="M83 94 L70 40 L122 72 Z" fill="url(#body)" stroke="#ff69b4" stroke-width="4"/>
  <path d="M237 94 L250 40 L198 72 Z" fill="url(#body)" stroke="#ff69b4" stroke-width="4"/>

  <!-- Kepala robot -->
  <rect x="70" y="65" width="180" height="145" rx="42" fill="url(#body)" stroke="#ff69b4" stroke-width="4"/>

  <!-- Mata kiri -->
  <rect x="98" y="112" width="43" height="30" rx="12" fill="#ff69b4" filter="url(#glow)">
    <animate attributeName="height" values="30;3;30" keyTimes="0;.08;.16" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="112;126;112" keyTimes="0;.08;.16" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Mata kanan -->
  <rect x="179" y="112" width="43" height="30" rx="12" fill="#b388ff" filter="url(#glow)">
    <animate attributeName="height" values="30;3;30" keyTimes="0;.08;.16" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="112;126;112" keyTimes="0;.08;.16" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Mulut -->
  <path d="M140 163 Q160 180 180 163" fill="none" stroke="#ff69b4" stroke-width="4" stroke-linecap="round"/>

  <!-- Pipi bercahaya -->
  <circle cx="88" cy="158" r="5" fill="#ff69b4" opacity=".8"/>
  <circle cx="232" cy="158" r="5" fill="#ff69b4" opacity=".8"/>

  <!-- Badan -->
  <path d="M115 210 L105 246 Q160 272 215 246 L205 210" fill="url(#body)" stroke="#b388ff" stroke-width="4"/>
  <rect x="137" y="222" width="46" height="25" rx="8" fill="#ff69b4" opacity=".9"/>
  <circle cx="160" cy="234" r="5" fill="#ffffff"/>

  <text x="160" y="286" fill="#ffb6e6" font-family="monospace" font-size="12" text-anchor="middle">NEKO-01 // ONLINE</text>
</svg>
